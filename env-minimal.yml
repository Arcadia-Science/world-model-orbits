# Minimal environment to run the analysis: the `analysis` package (src/analysis/)
# and the notebooks. Does NOT include the publication toolchain (Quarto render,
# ruff, pre-commit) -- use env.yml for that.
#
#   conda env create -n world-model-orbits --file env-minimal.yml
#   conda activate world-model-orbits
#   pip install -e .          # makes the `analysis` package importable
name: world-model-orbits
channels:
  - conda-forge
dependencies:
  - python=3.10

  # Numerics: trajectory integration (scipy.solve_ivp), ELM Jacobians, figures.
  - numpy=2.2
  - scipy=1.15
  - matplotlib=3.10
  - scikit-learn=1.7          # linear probes (analysis/probing.py)

  # Notebook execution (jupyter is what `quarto render` drives for .ipynb).
  - jupyterlab=4.3

  - pip
  - pip:
      # Installed via pip rather than conda-forge: this is the build the
      # checkpoints and the ELM float64 path were validated against.
      - torch==2.10.0
