# Environment for the publication: runs the `analysis` package, executes
# index.ipynb, and builds the Quarto site.
#
#   conda env create -n world-model-orbits --file env.yml
#   conda activate world-model-orbits
#   pip install -e .          # makes the `analysis` package importable
#
# Quarto itself is installed separately -- see pages/SETUP.qmd.
#
# Numerics are pinned to the versions the committed checkpoints and figures were
# produced with. matplotlib in particular: the stored figures in index.ipynb were
# rendered with 3.10, and minor versions change rendering.
name: world-model-orbits
channels:
  - conda-forge
dependencies:
  - python=3.10

  # --- analysis: the `analysis` package and the notebook ---------------------
  - numpy=2.2
  - scipy=1.15                # trajectory integration (solve_ivp)
  - matplotlib=3.10           # every figure in the pub
  - scikit-learn=1.7          # linear probes (analysis/probing.py)

  # --- notebook execution ----------------------------------------------------
  - jupyterlab=4.3            # what `quarto render` drives for .ipynb

  # --- publication toolchain -------------------------------------------------
  - pyyaml=6.0.2              # _build.py
  - pre_commit=4.1.0
  - ruff=0.9.6

  - pip
  - pip:
      # Installed via pip rather than conda-forge: this is the build the
      # checkpoints and the ELM float64 path were validated against.
      - torch==2.10.0

      - tqdm==4.67.0          # progress bars in analysis/data_generation.py
                              # (optional -- it has a no-op fallback)
      - jupyterlab-quarto==0.3.5

      # Arcadia's figure style guide: palettes, matplotlib rcParams, canonical
      # figure sizes. pip-only (not on conda-forge). Pulls in plotly and kaleido
      # as hard dependencies even though this pub only uses the matplotlib path.
      # The Atkinson Hyperlegible fonts are NOT bundled -- without them
      # apc.mpl.setup() warns and falls back to matplotlib's defaults. Install
      # from Google Fonts to match Arcadia's typography exactly.
      - arcadia-pycolor==0.8.0
